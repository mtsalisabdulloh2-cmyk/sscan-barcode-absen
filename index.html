<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scan Barcode - Absensi Siswa</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0a2a3e 0%, #1a4a6a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 1.5rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .header h1 {
            color: #0a2a3e;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }
        .header h1 i {
            color: #2a7f9e;
        }
        .header .subtitle {
            color: #64879e;
            font-size: 0.85rem;
            margin-top: 0.2rem;
        }
        .header .status-badge {
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 0.4rem;
        }
        .status-badge.waiting {
            background: #fff3e0;
            color: #e65100;
        }
        .status-badge.scanning {
            background: #e3f2fd;
            color: #0d47a1;
            animation: blink 0.8s infinite;
        }
        .status-badge.success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .status-badge.error {
            background: #ffebee;
            color: #c62828;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .scanner-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            max-width: 400px;
            margin: 0 auto 1rem;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            border: 3px solid #2a7f9e;
            box-shadow: 0 0 30px rgba(42, 127, 158, 0.3);
        }
        #scanner {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #scanner video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .scanner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scanner-frame {
            width: 70%;
            height: 70%;
            border: 3px solid rgba(42, 127, 158, 0.6);
            border-radius: 16px;
            position: relative;
        }
        .scanner-frame::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 30%;
            height: 3px;
            background: #2a7f9e;
            animation: scanLine 2s infinite linear;
        }
        @keyframes scanLine {
            0% { top: -2px; }
            50% { top: calc(100% + 2px); }
            100% { top: -2px; }
        }
        .scanner-frame .corner {
            position: absolute;
            width: 18px;
            height: 18px;
            border-color: #2a7f9e;
            border-style: solid;
            border-width: 0;
        }
        .scanner-frame .corner.tl { top: -3px; left: -3px; border-top-width: 4px; border-left-width: 4px; border-radius: 4px 0 0 0; }
        .scanner-frame .corner.tr { top: -3px; right: -3px; border-top-width: 4px; border-right-width: 4px; border-radius: 0 4px 0 0; }
        .scanner-frame .corner.bl { bottom: -3px; left: -3px; border-bottom-width: 4px; border-left-width: 4px; border-radius: 0 0 0 4px; }
        .scanner-frame .corner.br { bottom: -3px; right: -3px; border-bottom-width: 4px; border-right-width: 4px; border-radius: 0 0 4px 0; }

        .manual-input {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .manual-input input {
            flex: 1;
            padding: 0.7rem 1rem;
            border: 2px solid #dce8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
        }
        .manual-input input:focus {
            border-color: #2a7f9e;
            box-shadow: 0 0 0 3px rgba(42, 127, 158, 0.15);
        }
        .manual-input button {
            padding: 0.7rem 1.5rem;
            background: #1f5a77;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .manual-input button:hover {
            background: #134a63;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-group .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }
        .btn-primary {
            background: #1f5a77;
            color: white;
        }
        .btn-primary:hover {
            background: #134a63;
        }
        .btn-danger {
            background: #c84e4e;
            color: white;
        }
        .btn-danger:hover {
            background: #b13b3b;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #b6cfdf;
            color: #1b4c64;
        }
        .btn-outline:hover {
            background: #e3eff8;
        }
        .btn-success {
            background: #2b8c6b;
            color: white;
        }
        .btn-success:hover {
            background: #1f7356;
        }

        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .popup-overlay.active {
            display: flex;
        }
        .popup {
            background: white;
            border-radius: 32px;
            max-width: 420px;
            width: 100%;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { transform: scale(0.5) translateY(50px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        .popup .check-icon {
            font-size: 4rem;
            margin-bottom: 0.5rem;
            animation: checkPop 0.5s ease;
        }
        @keyframes checkPop {
            0% { transform: scale(0); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .popup .popup-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #2b8c6b;
            margin: 0.5rem auto;
            display: block;
        }
        .popup .popup-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0a2a3e;
            margin-top: 0.3rem;
        }
        .popup .popup-detail {
            color: #64879e;
            font-size: 0.9rem;
            margin: 0.2rem 0;
        }
        .popup .popup-status {
            display: inline-block;
            padding: 0.4rem 1.5rem;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }
        .popup .popup-status.hadir {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .popup .popup-status.already {
            background: #fff3e0;
            color: #e65100;
        }
        .popup .popup-status.error {
            background: #ffebee;
            color: #c62828;
        }
        .popup .popup-close {
            margin-top: 1rem;
            padding: 0.6rem 2rem;
            background: #1f5a77;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }
        .popup .popup-close:hover {
            background: #134a63;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #1f5a77;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
            align-items: center;
            gap: 0.5rem;
            z-index: 3000;
            animation: slideUp 0.3s ease;
            font-weight: 500;
        }
        .toast.show {
            display: flex;
        }
        .toast.error {
            background: #c84e4e;
        }
        .toast.success {
            background: #2b8c6b;
        }
        @keyframes slideUp {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .info-bar {
            background: #e3eff8;
            border-radius: 12px;
            padding: 0.5rem 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.3rem;
            font-size: 0.8rem;
            color: #1f4a61;
        }
        .info-bar .count {
            font-weight: 600;
        }

        .sync-status {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 600;
        }
        .sync-connected {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .sync-disconnected {
            background: #ffebee;
            color: #c62828;
        }

        @media (max-width: 480px) {
            .container { padding: 1rem; }
            .header h1 { font-size: 1.3rem; }
            .popup { padding: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>
            <i class="fas fa-qrcode"></i> Scan Barcode
        </h1>
        <div class="subtitle">Scan kode unik siswa untuk absensi</div>
        <div>
            <span class="status-badge waiting" id="statusBadge">
                <i class="fas fa-circle"></i> Siap Scan
            </span>
        </div>
        <div style="margin-top:0.3rem;">
            <span class="sync-status" id="syncStatus">⏳ Menghubungkan...</span>
        </div>
    </div>

    <!-- Info Bar -->
    <div class="info-bar">
        <span><i class="fas fa-users"></i> <span id="totalSiswa">0</span> siswa</span>
        <span><i class="fas fa-calendar-day"></i> <span id="tanggalHari"></span></span>
        <span><i class="fas fa-check-circle" style="color:#2e7d32;"></i> <span id="hadirHari">0</span> hadir</span>
    </div>

    <!-- Scanner -->
    <div class="scanner-container">
        <div id="scanner"></div>
        <div class="scanner-overlay">
            <div class="scanner-frame">
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
            </div>
        </div>
    </div>

    <!-- Manual Input -->
    <div class="manual-input">
        <input type="text" id="manualKode" placeholder="Atau ketik kode unik..." autocomplete="off">
        <button onclick="manualCheck()">
            <i class="fas fa-search"></i> Cek
        </button>
    </div>

    <!-- Buttons -->
    <div class="btn-group">
        <button class="btn btn-primary" onclick="startScanner()">
            <i class="fas fa-play"></i> Mulai Scan
        </button>
        <button class="btn btn-danger" onclick="stopScanner()">
            <i class="fas fa-stop"></i> Berhenti
        </button>
        <button class="btn btn-outline" onclick="syncData()">
            <i class="fas fa-sync"></i> Sync
        </button>
        <button class="btn btn-outline" onclick="location.reload()">
            <i class="fas fa-redo"></i> Reset
        </button>
    </div>
</div>

<!-- Popup -->
<div class="popup-overlay" id="popupSuccess">
    <div class="popup">
        <div class="check-icon" id="popupIcon">
            <i class="fas fa-check-circle" style="color:#2b8c6b;"></i>
        </div>
        <img class="popup-photo" id="popupPhoto" src="" alt="Foto">
        <div class="popup-status hadir" id="popupStatus">✅ HADIR</div>
        <div class="popup-name" id="popupName">Nama Siswa</div>
        <div class="popup-detail" id="popupKelas">Kelas: VII A</div>
        <div class="popup-detail" id="popupNisn">NISN: 1234567890</div>
        <div class="popup-detail" id="popupKode">Kode: S-2024-001</div>
        <div class="popup-detail" id="popupTime">Absen: 00:00:00</div>
        <button class="popup-close" onclick="closePopup()">
            <i class="fas fa-check"></i> OK
        </button>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
    <i class="fas fa-info-circle"></i>
    <span id="toastMessage">Pesan</span>
</div>

<!-- Firebase SDK -->
<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/11.3.0/firebase-database.js"
    }
}
</script>

<script type="module">
    import { initializeApp } from "firebase/app";
    import { getDatabase, ref, get, child, set, onValue } from "firebase/database";

    const firebaseConfig = {
        apiKey: "AIzaSyCFkIrTY4WLburyAdgJJ1c24bNx9Ldt1x8",
        authDomain: "scan-absen-734a0.firebaseapp.com",
        projectId: "scan-absen-734a0",
        storageBucket: "scan-absen-734a0.firebasestorage.app",
        messagingSenderId: "839071202835",
        appId: "1:839071202835:web:719c0986c1050463d109e6",
        measurementId: "G-PBQ5G0HYXS"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    window.db = database;
    window.dbRef = ref;
    window.dbGet = get;
    window.dbSet = set;
    window.dbChild = child;
    window.dbOnValue = onValue;

    console.log('🔥 Firebase initialized successfully!');
</script>

<script>
    // ============================================================
    // STATE - Menggunakan struktur yang sama dengan Admin
    // ============================================================
    let students = [];          // Array of student objects
    let attendance = {};        // { "2024-01-01": { "1": "Hadir", ... } }
    let scannerRunning = false;
    let lastScanned = null;
    let scanTimeout = null;
    let isFirebaseReady = false;

    // ============================================================
    // FIREBASE - LOAD DATA (Sama dengan Admin)
    // ============================================================
    async function loadFromFirebase() {
        try {
            const db = window.db;
            const dbRef = window.dbRef;
            const dbGet = window.dbGet;
            const dbChild = window.dbChild;

            const snapshot = await dbGet(dbChild(dbRef(db), 'absensiData'));
            
            if (snapshot.exists()) {
                const data = snapshot.val();
                
                // Load students - sama dengan admin
                if (data.students) {
                    students = Object.values(data.students).filter(s => s !== null);
                    // Save to localStorage as backup
                    localStorage.setItem('siswaData', JSON.stringify(students));
                    console.log(`📚 Loaded ${students.length} students from Firebase`);
                }
                
                // Load attendance - sama dengan admin
                if (data.attendance) {
                    attendance = data.attendance;
                    console.log('📊 Attendance loaded from Firebase');
                }
                
                return true;
            }
            return false;
        } catch (error) {
            console.error('Load from Firebase error:', error);
            return false;
        }
    }

    // ============================================================
    // FIREBASE - SAVE DATA
    // ============================================================
    async function saveToFirebase() {
        try {
            const db = window.db;
            const dbRef = window.dbRef;
            const dbSet = window.dbSet;

            // Get existing data first to preserve all fields
            const snapshot = await dbGet(dbRef(db, 'absensiData'));
            let existingData = {};
            if (snapshot.exists()) {
                existingData = snapshot.val();
            }

            // Update only the fields we manage
            existingData.students = students;
            existingData.attendance = attendance;
            existingData.updatedAt = new Date().toISOString();

            await dbSet(dbRef(db, 'absensiData'), existingData);
            return true;
        } catch (error) {
            console.error('Save to Firebase error:', error);
            return false;
        }
    }

    // ============================================================
    // SYNC DATA
    // ============================================================
    async function syncData() {
        const statusBadge = document.getElementById('statusBadge');
        statusBadge.className = 'status-badge scanning';
        statusBadge.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sinkronisasi...';
        
        const loaded = await loadFromFirebase();
        
        if (loaded) {
            updateInfo();
            statusBadge.className = 'status-badge success';
            statusBadge.innerHTML = '<i class="fas fa-check"></i> Data dimuat!';
            showToast('✅ Data berhasil dimuat dari Firebase!', 'success');
            setTimeout(() => {
                statusBadge.className = 'status-badge waiting';
                statusBadge.innerHTML = '<i class="fas fa-circle"></i> Siap Scan';
            }, 2000);
        } else {
            // Try loading from localStorage as backup
            const stored = localStorage.getItem('siswaData');
            if (stored) {
                try {
                    students = JSON.parse(stored);
                    updateInfo();
                    statusBadge.className = 'status-badge success';
                    statusBadge.innerHTML = '<i class="fas fa-check"></i> Data lokal dimuat!';
                    showToast('📁 Data dimuat dari localStorage (offline mode)', 'info');
                    setTimeout(() => {
                        statusBadge.className = 'status-badge waiting';
                        statusBadge.innerHTML = '<i class="fas fa-circle"></i> Siap Scan';
                    }, 2000);
                } catch(e) {
                    statusBadge.className = 'status-badge error';
                    statusBadge.innerHTML = '<i class="fas fa-exclamation-circle"></i> Gagal sync';
                    showToast('❌ Gagal memuat data', 'error');
                }
            } else {
                statusBadge.className = 'status-badge error';
                statusBadge.innerHTML = '<i class="fas fa-exclamation-circle"></i> Gagal sync';
                showToast('❌ Gagal memuat data', 'error');
            }
        }
    }

    // ============================================================
    // SCANNER
    // ============================================================
    function startScanner() {
        if (scannerRunning) {
            showToast('Scanner sudah berjalan', 'info');
            return;
        }

        const status = document.getElementById('statusBadge');
        status.className = 'status-badge scanning';
        status.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengakses kamera...';

        Quagga.init({
            inputStream: {
                name: "Live",
                type: "LiveStream",
                target: document.querySelector('#scanner'),
                constraints: {
                    facingMode: "environment",
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                }
            },
            decoder: {
                readers: [
                    "code_128_reader", "ean_reader", "ean_8_reader",
                    "code_39_reader", "code_93_reader", "codabar_reader",
                    "upc_reader", "upc_e_reader", "i2of5_reader",
                    "2of5_reader", "code_39_vin_reader"
                ],
                multiple: false
            },
            locate: true,
            locator: { patchSize: 'medium', halfSample: true }
        }, function(err) {
            if (err) {
                console.error(err);
                status.className = 'status-badge error';
                status.innerHTML = '<i class="fas fa-exclamation-circle"></i> Gagal akses kamera';
                showToast('❌ Gagal mengakses kamera!', 'error');
                return;
            }

            scannerRunning = true;
            status.className = 'status-badge scanning';
            status.innerHTML = '<i class="fas fa-circle"></i> Memindai...';
            showToast('📷 Scanner aktif. Arahkan ke barcode.', 'success');
            Quagga.start();
        });

        Quagga.onDetected(function(result) {
            const code = result.codeResult.code;
            if (code && code !== lastScanned) {
                lastScanned = code;
                clearTimeout(scanTimeout);
                scanTimeout = setTimeout(() => { lastScanned = null; }, 3000);
                
                // Proses absensi
                processAttendance(code);
            }
        });
    }

    function stopScanner() {
        if (scannerRunning) {
            Quagga.stop();
            scannerRunning = false;
            const status = document.getElementById('statusBadge');
            status.className = 'status-badge waiting';
            status.innerHTML = '<i class="fas fa-circle"></i> Siap Scan';
            showToast('⏹️ Scanner dihentikan', 'info');
        }
    }

    // ============================================================
    // MANUAL CHECK
    // ============================================================
    function manualCheck() {
        const input = document.getElementById('manualKode');
        const kode = input.value.trim();
        if (!kode) {
            showToast('⚠️ Masukkan kode unik!', 'error');
            input.focus();
            return;
        }
        processAttendance(kode);
        input.value = '';
    }

    document.getElementById('manualKode').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            manualCheck();
        }
    });

    // ============================================================
    // PROCESS ATTENDANCE - Menggunakan struktur yang sama dengan Admin
    // ============================================================
    async function processAttendance(kode) {
        // Cari siswa berdasarkan kodeUnik
        const student = students.find(s => s.kodeUnik === kode);

        if (!student) {
            showPopupError(`❌ Siswa dengan kode "${kode}" tidak ditemukan!`);
            showToast('❌ Siswa tidak ditemukan!', 'error');
            if (navigator.vibrate) navigator.vibrate(200);
            return;
        }

        const today = new Date().toISOString().split('T')[0];
        const alreadyAbsen = attendance[today] && attendance[today][student.id];

        if (alreadyAbsen) {
            showPopup(student, true);
            showToast(`⚠️ ${student.namaLengkap} sudah absen hari ini!`, 'info');
            if (navigator.vibrate) navigator.vibrate(100);
            return;
        }

        // Record attendance
        if (!attendance[today]) {
            attendance[today] = {};
        }
        attendance[today][student.id] = 'Hadir';

        // Save to localStorage
        localStorage.setItem('attendanceData', JSON.stringify(attendance));

        // Save to Firebase
        await saveToFirebase();

        showPopup(student, false);
        showToast(`✅ ${student.namaLengkap} berhasil absen!`, 'success');
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        updateInfo();
    }

    // ============================================================
    // POPUPS
    // ============================================================
    function showPopup(student, alreadyAbsen) {
        const overlay = document.getElementById('popupSuccess');
        const photo = document.getElementById('popupPhoto');
        const icon = document.getElementById('popupIcon').querySelector('i');
        const status = document.getElementById('popupStatus');

        // Set foto
        if (student.foto && student.foto.startsWith('data:image')) {
            photo.src = student.foto;
            photo.style.display = 'block';
        } else {
            photo.style.display = 'none';
        }

        document.getElementById('popupName').textContent = student.namaLengkap || 'Nama tidak tersedia';
        document.getElementById('popupKelas').textContent = `Kelas: ${student.kelas || '-'}`;
        document.getElementById('popupNisn').textContent = `NISN: ${student.nisn || '-'}`;
        document.getElementById('popupKode').textContent = `Kode: ${student.kodeUnik || '-'}`;

        if (alreadyAbsen) {
            status.textContent = '⚠️ SUDAH ABSEN';
            status.className = 'popup-status already';
            icon.className = 'fas fa-exclamation-triangle';
            icon.style.color = '#e65100';
        } else {
            status.textContent = '✅ HADIR';
            status.className = 'popup-status hadir';
            icon.className = 'fas fa-check-circle';
            icon.style.color = '#2b8c6b';
        }

        const now = new Date();
        document.getElementById('popupTime').textContent = `Absen: ${now.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit', second:'2-digit' })}`;

        overlay.classList.add('active');
        clearTimeout(window.popupTimeout);
        window.popupTimeout = setTimeout(closePopup, 5000);
    }

    function showPopupError(message) {
        const overlay = document.getElementById('popupSuccess');
        document.getElementById('popupPhoto').style.display = 'none';
        document.getElementById('popupName').textContent = '❌ Error';
        document.getElementById('popupKelas').textContent = '';
        document.getElementById('popupNisn').textContent = '';
        document.getElementById('popupKode').textContent = message;
        document.getElementById('popupTime').textContent = '';

        const icon = document.getElementById('popupIcon').querySelector('i');
        icon.className = 'fas fa-times-circle';
        icon.style.color = '#c62828';

        const status = document.getElementById('popupStatus');
        status.textContent = '❌ GAGAL';
        status.className = 'popup-status error';

        overlay.classList.add('active');
        clearTimeout(window.popupTimeout);
        window.popupTimeout = setTimeout(closePopup, 4000);
    }

    function closePopup() {
        document.getElementById('popupSuccess').classList.remove('active');
        clearTimeout(window.popupTimeout);
        lastScanned = null;
    }

    document.getElementById('popupSuccess').addEventListener('click', function(e) {
        if (e.target === this) closePopup();
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closePopup();
    });

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        const msg = document.getElementById('toastMessage');
        msg.textContent = message;
        toast.className = 'toast show';
        if (type === 'error') toast.classList.add('error');
        else if (type === 'success') toast.classList.add('success');

        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => {
            toast.classList.remove('show');
            toast.className = 'toast';
        }, 3000);
    }

    // ============================================================
    // INFO BAR
    // ============================================================
    function updateInfo() {
        document.getElementById('totalSiswa').textContent = students.length;

        const today = new Date();
        document.getElementById('tanggalHari').textContent = 
            today.toLocaleDateString('id-ID', { weekday:'short', day:'numeric', month:'short' });

        const todayStr = today.toISOString().split('T')[0];
        const hadir = attendance[todayStr] ? Object.keys(attendance[todayStr]).length : 0;
        document.getElementById('hadirHari').textContent = hadir;
    }

    // ============================================================
    // CHECK FIREBASE CONNECTION
    // ============================================================
    function checkFirebaseConnection() {
        const syncStatus = document.getElementById('syncStatus');
        const checkInterval = setInterval(() => {
            if (window.db) {
                clearInterval(checkInterval);
                isFirebaseReady = true;
                syncStatus.textContent = '✅ Terhubung ke Firebase';
                syncStatus.className = 'sync-status sync-connected';
                
                // Load data dari Firebase
                loadFromFirebase().then(loaded => {
                    if (loaded) {
                        updateInfo();
                        console.log('📥 Data loaded from Firebase');
                        showToast('✅ Data dimuat dari Firebase', 'success');
                    }
                });
            }
        }, 500);

        // Fallback
        setTimeout(() => {
            if (!isFirebaseReady) {
                syncStatus.textContent = '⚠️ Mode Offline (Local)';
                syncStatus.className = 'sync-status sync-disconnected';
                
                // Coba load dari localStorage
                const stored = localStorage.getItem('siswaData');
                if (stored) {
                    try {
                        students = JSON.parse(stored);
                        updateInfo();
                        console.log('📁 Data loaded from localStorage');
                    } catch(e) {}
                }
            }
        }, 3000);
    }

    // ============================================================
    // INIT
    // ============================================================
    async function initApp() {
        // Load data dari localStorage terlebih dahulu (cepat)
        const stored = localStorage.getItem('siswaData');
        if (stored) {
            try {
                students = JSON.parse(stored);
                updateInfo();
                console.log(`📁 Loaded ${students.length} students from localStorage`);
            } catch(e) {}
        }

        // Cek koneksi Firebase
        checkFirebaseConnection();

        // Auto start scanner
        setTimeout(startScanner, 800);

        // Auto sync setiap 30 detik
        setInterval(async () => {
            if (isFirebaseReady) {
                await loadFromFirebase();
                updateInfo();
            }
        }, 30000);
    }

    // Cleanup
    window.addEventListener('beforeunload', stopScanner);
    document.addEventListener('visibilitychange', function() {
        if (document.hidden && scannerRunning) {
            Quagga.stop();
            scannerRunning = false;
        } else if (!document.hidden && !scannerRunning) {
            setTimeout(startScanner, 500);
        }
    });

    // ============================================================
    // EXPOSE FUNCTIONS
    // ============================================================
    window.startScanner = startScanner;
    window.stopScanner = stopScanner;
    window.manualCheck = manualCheck;
    window.processAttendance = processAttendance;
    window.closePopup = closePopup;
    window.showToast = showToast;
    window.syncData = syncData;
    window.loadFromFirebase = loadFromFirebase;
    window.saveToFirebase = saveToFirebase;

    // Start app
    initApp();

    console.log('📱 Scan Barcode Absensi - Terhubung dengan Admin');
    console.log(`📚 Total siswa: ${students.length}`);
    console.log('💡 Arahkan kamera ke barcode kode unik siswa');
</script>
</body>
</html>
